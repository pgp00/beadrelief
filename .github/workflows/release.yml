name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify release version
        run: node -e "const fs=require('node:fs'),p=require('./package.json'); if(process.env.GITHUB_REF_NAME!=='v'+p.version || !fs.readFileSync('CHANGELOG.md','utf8').includes('## '+p.version+' -')) throw new Error('Tag, package version, and changelog must match')"
      - run: npm run release:prepare
      - run: git diff --exit-code -- samples SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
      - name: Upload verified samples
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" samples/*.3mf samples/*-project.json samples/*-source.png SHA256SUMS --clobber
